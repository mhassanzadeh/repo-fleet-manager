name: RFM CI

on:
  push:
    branches:
      - master
      - main
  pull_request:
    branches:
      - master
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rfm-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install build and runtime dependencies
        run: python -m pip install --upgrade pip build
      - name: Install RFM
        run: python -m pip install -e .
      - name: Validate release metadata
        run: python scripts/check_release_version.py
      - name: Validate strict sample configurations
        run: |
          rfm config --config configs/repo-fleet.example.json validate --strict
          rfm config --config configs/repo-fleet.lifecycle.example.json validate --strict
          rfm config --config configs/goftaroo.example.json validate --strict
      - name: Run tests
        run: make test
      - name: Validate documentation and catalog evidence
        run: |
          make validate-docs
          make catalog-check
      - name: Validate shell completion
        run: |
          bash -n completions/rfm.bash
          rfm completion bash | bash -n
          test -n "$(rfm completion fish)"
      - name: Build package
        run: make build
      - name: Upload package artifacts
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: rfm-package
          path: dist/*
          if-no-files-found: error

  container-cli:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        engine: [docker, podman]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install Podman
        if: matrix.engine == 'podman'
        run: sudo apt-get update && sudo apt-get install -y podman
      - name: Verify container engine and RFM doctor
        run: |
          ${{ matrix.engine }} --version
          python -m pip install -e .
          rfm doctor --config configs/repo-fleet.example.json
